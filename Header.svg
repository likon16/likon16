<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24c6dc"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;12 .5 .5;0 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7df3ff"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
    <style>
      .name { font: 800 64px 'Segoe UI', Arial, sans-serif; letter-spacing: 4px; fill: url(#title); }
      .sub { font: 600 24px 'Courier New', monospace; fill: #00e5ff; opacity: 0; }
      .s1 { animation: cycle 12s infinite 0s; }
      .s2 { animation: cycle 12s infinite 3s; }
      .s3 { animation: cycle 12s infinite 6s; }
      .s4 { animation: cycle 12s infinite 9s; }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(8px); }
        4% { opacity: 1; transform: translateY(0); }
        22% { opacity: 1; transform: translateY(0); }
        26% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; }
      }
      .star { fill: #fff; animation: tw 3s infinite ease-in-out; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <circle class="star" cx="80" cy="50" r="2"/>
    <circle class="star" cx="220" cy="120" r="1.5" style="animation-delay:.6s"/>
    <circle class="star" cx="380" cy="40" r="2" style="animation-delay:1.2s"/>
    <circle class="star" cx="560" cy="90" r="1.5" style="animation-delay:1.8s"/>
    <circle class="star" cx="720" cy="35" r="2" style="animation-delay:.3s"/>
    <circle class="star" cx="880" cy="110" r="1.5" style="animation-delay:2.1s"/>
    <circle class="star" cx="940" cy="45" r="2" style="animation-delay:1.5s"/>
    <circle class="star" cx="140" cy="200" r="1.5" style="animation-delay:.9s"/>

    <text class="name" x="500" y="125" text-anchor="middle">LIKHON BARMAN</text>

    <text class="sub s1" x="500" y="185" text-anchor="middle">Full-Stack Developer | 1+ Year Experience</text>
    <text class="sub s2" x="500" y="185" text-anchor="middle">Web &amp; Mobile Application Developer</text>
    <text class="sub s3" x="500" y="185" text-anchor="middle">Prompt Engineering &amp; AI Integration</text>
    <text class="sub s4" x="500" y="185" text-anchor="middle">Turning ideas into real products</text>

    <path d="M0 250 Q 125 220 250 250 T 500 250 T 750 250 T 1000 250 T 1250 250 T 1500 250 V300 H0 Z" fill="#ffffff" fill-opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 265 Q 125 240 250 265 T 500 265 T 750 265 T 1000 265 T 1250 265 T 1500 265 V300 H0 Z" fill="#ffffff" fill-opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
